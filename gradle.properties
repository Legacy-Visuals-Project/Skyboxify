# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod.name=Skyboxify
mod.id=skyboxify
mod.version=2.3
mod.group=btw.lowercase
